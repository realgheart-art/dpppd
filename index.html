<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dialog Prestasi PPD — JPN Kedah</title>
<meta name="theme-color" content="#0f2942">
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2942; --navy-700:#16385a; --navy-300:#3a5f85;
  --brass:#b8860b; --brass-light:#e0b84a; --brass-soft:#f5ecd4;
  --ink:#1a2430; --muted:#6b7785; --line:#e2e7ec; --bg:#f6f8fa; --card:#ffffff;
  --ok:#1f8a4c; --ok-bg:#e4f4ea; --warn:#b8860b; --warn-bg:#fbf3dd;
  --danger:#c0392b; --danger-bg:#fbe6e3; --info:#2b6cb0; --info-bg:#e6f0f9;
  --radius:14px; --shadow:0 1px 3px rgba(15,41,66,.08),0 6px 24px rgba(15,41,66,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:15px}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(135deg,#0f2942 0%,#16385a 55%,#0b1f33 100%)}
.login-card{background:var(--card);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);
  width:100%;max-width:420px;overflow:hidden}
.login-head{background:var(--navy);color:#fff;padding:36px 32px 30px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;text-align:center}
.login-head::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;
  border-radius:50%;background:radial-gradient(circle,rgba(184,134,11,.35),transparent 70%)}
.crest{width:44px;height:44px;border-radius:11px;background:var(--brass);display:flex;align-items:center;
  justify-content:center;font-family:'Fraunces',serif;font-weight:700;color:var(--navy);font-size:22px;margin-bottom:16px}
.crest--logo{background:transparent;border-radius:0;overflow:visible;padding:0;box-shadow:none}
.crest--logo img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 3px 7px rgba(0,0,0,.4))}
.login-head .crest--logo{width:160px;height:160px;margin-bottom:14px}
.login-head .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-light);font-weight:600;margin-bottom:6px}
.login-head h1{color:#fff;font-size:24px;line-height:1.2}
.login-head p{color:#b8c6d6;font-size:13px;margin-top:6px}
.login-body{padding:28px 32px 32px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.02em}
.field input,.field select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;
  background:#fbfcfd;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(184,134,11,.12)}
.btn-primary{width:100%;padding:13px;background:var(--navy);color:#fff;border-radius:10px;font-weight:600;font-size:15px;
  transition:background .15s,transform .05s}
.btn-primary:hover{background:var(--navy-700)}
.btn-primary:active{transform:translateY(1px)}
.login-hint{margin-top:18px;padding:12px 14px;background:var(--brass-soft);border-radius:10px;font-size:12px;color:#7a5c08;line-height:1.6}
.login-hint b{color:var(--navy)}
.demo-chip{display:inline-block;background:#fff;border:1px solid var(--brass);color:var(--navy);
  padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;margin:2px 3px 0 0;cursor:pointer}
.demo-chip:hover{background:var(--brass);color:#fff}

/* ---------- APP SHELL ---------- */
#appView{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--navy);color:#fff;padding:0 20px;height:60px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:40;box-shadow:0 2px 12px rgba(15,41,66,.18)}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar .crest{width:34px;height:34px;font-size:17px;border-radius:9px;margin:0}
.topbar .crest--logo{width:44px;height:44px;border-radius:0}
.topbar-title{font-family:'Fraunces',serif;font-weight:600;font-size:16px;line-height:1.1}
.topbar-title small{display:block;font-family:'Plus Jakarta Sans';font-weight:500;font-size:11px;color:var(--brass-light);letter-spacing:.04em}
.topbar-right{display:flex;align-items:center;gap:14px}
.user-badge{text-align:right;font-size:12px;line-height:1.3}
.user-badge b{font-size:13px}
.user-badge span{color:#b8c6d6;display:block}
.icon-btn{color:#cdd9e6;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.18);font-weight:600}
.icon-btn:hover{background:rgba(255,255,255,.1);color:#fff}

.layout{display:flex;flex:1;min-height:0}
.sidebar{width:230px;background:var(--card);border-right:1px solid var(--line);padding:16px 12px;flex-shrink:0}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--ink);
  font-weight:500;font-size:14px;width:100%;text-align:left;transition:background .12s;margin-bottom:2px}
.nav-item:hover{background:var(--bg)}
.nav-item.active{background:var(--navy);color:#fff;font-weight:600}
.nav-item.active .nav-ico{color:var(--brass-light)}
.nav-ico{width:20px;text-align:center;font-size:15px;color:var(--navy-300)}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:700;
  min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.nav-item.active .nav-badge{background:var(--brass)}

.main{flex:1;overflow-y:auto;padding:26px 30px 60px;min-width:0}
.page-head{margin-bottom:22px}
.page-head .eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--brass);font-weight:700;margin-bottom:5px}
.page-head h2{font-size:26px}
.page-head p{color:var(--muted);font-size:14px;margin-top:4px}

/* ---------- CARDS / STATS ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:26px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--line);position:relative;overflow:hidden}
.stat-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brass)}
.stat-card .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat-card .val{font-family:'Fraunces',serif;font-size:36px;font-weight:600;color:var(--navy);margin-top:6px;line-height:1}
.stat-card .sub{font-size:12.5px;color:var(--muted);margin-top:6px}
.stat-card.ok::before{background:var(--ok)}
.stat-card.warn::before{background:var(--warn)}
.stat-card.danger::before{background:var(--danger)}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:22px}
.card-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-head h3{font-size:18px}
.card-head .sub{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px}
.card-body{padding:22px}
.card-body.flush{padding:0}

/* ---------- TABLE ---------- */
table{width:100%;border-collapse:collapse}
thead th{background:#fafbfc;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);font-weight:700;padding:11px 16px;border-bottom:2px solid var(--line);white-space:nowrap}
tbody td{padding:13px 16px;border-bottom:1px solid #eef1f4;font-size:13.5px;vertical-align:top}
tbody tr:hover{background:#fafbfc}
tbody tr:last-child td{border-bottom:none}
.t-center{text-align:center}

/* compliance grid */
.comp-cell{display:inline-flex;align-items:center;justify-content:center;min-width:74px;padding:5px 8px;
  border-radius:7px;font-size:12px;font-weight:600}
.comp-yes{background:var(--ok-bg);color:var(--ok)}
.comp-no{background:var(--danger-bg);color:var(--danger)}
.comp-tangguh{background:var(--warn-bg);color:#7a5c08}
.comp-klik{cursor:pointer;transition:transform .1s,box-shadow .1s}
.comp-klik:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(31,138,76,.28);text-decoration:underline}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-progress{background:var(--info-bg);color:var(--info)}
.b-pending{background:var(--warn-bg);color:var(--warn)}
.b-danger{background:var(--danger-bg);color:var(--danger)}
.b-cat{background:var(--brass-soft);color:#7a5c08;font-weight:600}
.b-neutral{background:#eef1f4;color:var(--muted)}

.pill{font-size:11px;padding:2px 8px;border-radius:5px;background:#eef1f4;color:var(--muted);font-weight:600}

/* ---------- FORM ---------- */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.form-field{margin-bottom:16px}
.form-field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.form-field label .req{color:var(--danger)}
.form-field input,.form-field select,.form-field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);
  border-radius:9px;background:#fbfcfd;transition:border-color .15s,box-shadow .15s}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(184,134,11,.12)}
.form-field textarea{resize:vertical;min-height:70px}
.form-field .help{font-size:12px;color:var(--muted);margin-top:5px}

.issue-block{border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;background:#fbfcfd;position:relative}
.issue-block .issue-num{position:absolute;top:-10px;left:14px;background:var(--navy);color:#fff;font-size:11px;
  font-weight:700;padding:2px 10px;border-radius:12px;font-family:'Fraunces',serif}
.remove-issue{position:absolute;top:10px;right:12px;color:var(--danger);font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px}
.remove-issue:hover{background:var(--danger-bg)}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.checkbox-row input{width:auto}
.checkbox-row label{margin:0;font-weight:500;font-size:13px}

.btn{padding:10px 18px;border-radius:9px;font-weight:600;font-size:14px;transition:all .15s}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-700)}
.btn-brass{background:var(--brass);color:#fff}
.btn-brass:hover{background:#a5790a}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--navy-300);background:var(--bg)}
.btn-sm{padding:6px 12px;font-size:12.5px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}

/* banner */
.banner{background:var(--warn-bg);border:1px solid var(--brass);border-radius:12px;padding:14px 18px;
  margin-bottom:22px;display:flex;align-items:center;gap:12px}
.banner .b-ico{font-size:22px}
.banner b{color:var(--navy)}
.banner-text{font-size:13.5px;color:#7a5c08;flex:1}
.banner-close{margin-left:auto;color:#7a5c08;font-size:18px;padding:4px 8px}

/* feedback thread */
.fb-item{padding:14px 16px;border-left:3px solid var(--brass);background:#fbfcfd;border-radius:0 10px 10px 0;margin-bottom:12px}
.fb-meta{font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.fb-meta b{color:var(--navy)}
.fb-text{font-size:13.5px}

/* section list detail */
.detail-issue{padding:14px 0;border-bottom:1px solid var(--line)}
.detail-issue:last-child{border-bottom:none}
.di-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.di-desc{font-size:14px;color:var(--ink)}

.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ico{font-size:38px;margin-bottom:10px;opacity:.4}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(15,41,66,.5);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:19px}
.modal-body{padding:22px 24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}

.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.filter-bar select,.filter-bar input{padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-size:13.5px}
.filter-bar select:focus,.filter-bar input:focus{outline:none;border-color:var(--brass)}

/* --- Penunjuk sedang memproses --- */
.proses-back{position:fixed;inset:0;background:rgba(15,41,66,.55);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;z-index:300}
.proses-box{background:#fff;border-radius:14px;padding:26px 34px;text-align:center;
  box-shadow:0 18px 50px rgba(0,0,0,.28);min-width:240px}
.spinner{width:38px;height:38px;margin:0 auto 14px;border:3.5px solid var(--line);
  border-top-color:var(--brass);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.proses-msg{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:14.5px;color:var(--navy)}
.proses-sub{font-size:12px;color:var(--muted);margin-top:5px}
.btn:disabled,.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.45);
  border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:7px}
@media(prefers-reduced-motion:reduce){.spinner,.btn-spin{animation-duration:2s}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--navy);
  color:#fff;padding:13px 22px;border-radius:11px;font-weight:600;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);
  z-index:200;opacity:0;transition:all .3s;display:flex;align-items:center;gap:9px}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast .tick{color:var(--brass-light)}

.demo-note{background:var(--info-bg);border:1px dashed var(--info);border-radius:10px;padding:12px 16px;font-size:12.5px;color:#1f5a8f;margin-bottom:20px}
.demo-note b{color:var(--navy)}
.gambar-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gambar-input{position:absolute;width:.1px;height:.1px;opacity:0;overflow:hidden;z-index:-1}
.gambar-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border:2px dashed var(--line);border-radius:12px;padding:26px 12px;cursor:pointer;color:var(--muted);
  background:#fbfcfd;transition:border-color .15s,background .15s;text-align:center;font-size:13px;font-weight:600}
.gambar-drop:hover{border-color:var(--brass);background:var(--brass-soft);color:#7a5c08}
.gambar-ico{font-size:26px;line-height:1;color:var(--navy-300)}
.gambar-hint{font-size:11px;font-weight:500;color:#aab}
.gambar-preview{position:relative;border-radius:12px;overflow:hidden;border:1.5px solid var(--line)}
.gambar-preview img{width:100%;height:180px;object-fit:cover;display:block}
.gambar-remove{position:absolute;top:8px;right:8px;background:rgba(15,41,66,.85);color:#fff;font-size:12px;
  font-weight:600;padding:5px 10px;border-radius:7px;backdrop-filter:blur(2px)}
.gambar-remove:hover{background:var(--danger)}
.gambar-thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.gambar-thumbs img{width:120px;height:88px;object-fit:cover;border-radius:9px;border:1.5px solid var(--line);cursor:pointer;transition:transform .12s}
.gambar-thumbs img:hover{transform:scale(1.03);border-color:var(--brass)}

/* mobile */
.hamburger{display:none;color:#fff;font-size:22px;padding:4px 8px}
@media(max-width:860px){
  .hamburger{display:block}
  .sidebar{position:fixed;left:0;top:60px;bottom:0;z-index:35;transform:translateX(-100%);transition:transform .25s;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  .sidebar.open{transform:translateX(0)}
  .main{padding:20px 16px 50px}
  .form-row{grid-template-columns:1fr}
  .topbar-title small{display:none}
  .user-badge span{display:none}
  .scroll-x{overflow-x:auto}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginView">
  <div class="login-card">
    <div class="login-head">
      <div class="crest crest--logo"><img src="logo.png" alt="Logo Dialog Prestasi PPD JPN Kedah"></div>
      <div class="eyebrow">JPN Kedah · Sektor S4PD</div>
      <h1>Dialog Prestasi PPD</h1>
      <p>Sistem Pemantauan Pelaksanaan, Isu &amp; Tindak Susul</p>
    </div>
    <div class="login-body">
      <div class="field">
        <label>Nama Pengguna</label>
        <input id="loginUser" type="text" placeholder="cth: admin_s4pd atau ppd01" autocomplete="username">
      </div>
      <div class="field">
        <label>Kata Laluan</label>
        <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn-primary" onclick="doLogin()">Log Masuk</button>
      <div class="login-hint" id="demoHint">
        <b>Mod Demo</b> — klik untuk log masuk pantas:<br>
        <span class="demo-chip" onclick="quickLogin('admin_s4pd')">JPN Admin (S4PD)</span>
        <span class="demo-chip" onclick="quickLogin('ppd02')">PPD Kota Setar</span>
        <span class="demo-chip" onclick="quickLogin('ppd05')">PPD Kulim/BB</span>
      </div>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="appView" class="hidden">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>
      <div class="crest crest--logo"><img src="logo.png" alt="Logo"></div>
      <div class="topbar-title">Dialog Prestasi PPD<small>JPN KEDAH · SEKTOR S4PD</small></div>
    </div>
    <div class="topbar-right">
      <div class="user-badge">
        <b id="ubName">—</b>
        <span id="ubRole">—</span>
      </div>
      <button class="icon-btn" onclick="doLogout()">Log Keluar</button>
    </div>
  </div>
  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="toast" id="toast"><span class="tick">✓</span><span id="toastMsg"></span></div>

<script>
/* ============================================================
   KONFIGURASI — tukar API_URL bila GAS Web App dah deploy.
   Bila DEMO_MODE = false, semua fungsi guna fetch() ke GAS.
   ============================================================ */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbzqDiZkWMCX_aHUzWb8Ut1ktejj0rvueHFZWJFDRjGFbYMCQvhDWYR2FlIIP2aawuD-Jg/exec", // ← ganti selepas deploy GAS
  DEMO_MODE: false,   // true = guna data terbenam di bawah (tiada backend perlu)
};

/* ============================================================
   LAPISAN API — hanya digunakan bila DEMO_MODE = false.
   POST guna Content-Type text/plain untuk elak CORS preflight.
   ============================================================ */
async function apiGet(action, params={}){
  const url=new URL(CONFIG.API_URL);
  url.searchParams.set("action",action);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const res=await fetch(url.toString());
  const j=await res.json();
  if(!j.ok) throw new Error(j.error||"Ralat API");
  return j.data;
}
async function apiPost(action, payload={}){
  const res=await fetch(CONFIG.API_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action,payload}),
  });
  const j=await res.json();
  if(!j.ok) throw new Error(j.error||"Ralat API");
  return j.data;
}
/* Petakan baris Sheets (nama lajur) → bentuk DB frontend (camelCase) */

  const yn=(v)=>String(v).trim().toLowerCase()==="ya";

  DB.config={

  DB.weeks=(raw.weeks||[]).map(w=>({no:Number(w.no),tarikh:dstr(w.tarikh),
    tahun:Number(w.tahun)|| (w.tarikh?new Date(w.tarikh).getFullYear():Number(raw.config.TAHUN_SEMASA))}));
  DB.dialog=(raw.dialog||[]).map(r=>({id:r.DialogID,ppdId:r.PPD_ID,tarikh:dstr(r.TarikhDialog),
    hari:r.Hari,masa:r.Masa,tempat:r.Tempat,pengerusi:r.Pengerusi,minggu:Number(r.MingguKe),tahun:Number(r.Tahun),
    kehadiran:r.Kehadiran?String(r.Kehadiran).split("|").map(s=>s.trim()).filter(Boolean):[],

    gambar1:r.Gambar1||null,gambar2:r.Gambar2||null,
    tarikhBatal:dstr(r.TarikhBatal),dibatalkanOleh:r.DibatalkanOleh||null}));
  DB.isu=(raw.isu||[]).map(r=>({id:r.IsuID,dialogId:r.DialogID,ppdId:r.PPD_ID,kategoriId:r.KategoriID,
    penerangan:r.Penerangan,tindakan:r.Tindakan,sektorPegawai:r.SektorPegawai,
    perluTindakSusul:yn(r.PerluTindakSusul),tarikh:dstr(r.TarikhDicatat),
    kawalanKPPD:r.KawalanKPPD||"Ya",statusMakluman:r.StatusMakluman||"Belum Dimaklumkan",tarikhMakluman:dstr(r.TarikhMakluman)}));
  DB.tindakSusul=(raw.tindakSusul||[]).map(r=>{

/* Senarai minggu dibina daripada TARIKH sesi rekod (bukan MingguKe tersimpan) */
function binaSenaraiMinggu(){
  const peta={};
  DB.dialog.forEach(d=>{
    if(!d.tarikh||isDibatalkan(d))return;
    const i=mingguInfo(d.tarikh); if(!i)return;
    const k=i.tahun+"-"+i.minggu;
    if(!peta[k]) peta[k]={no:i.minggu,tahun:i.tahun,tarikh:i.mula};
  });
  const senarai=Object.values(peta).sort((a,b)=>(a.tahun-b.tahun)||(a.no-b.no));
  if(senarai.length) DB.weeks=senarai;
}

/* PPD_ID dalam laporan yang tiada dalam tab PPD (punca 'Belum' walaupun ada laporan) */

const katShort=(id)=>{const k=DB.kategori.find(x=>x.id===id);return k?k.nama.split("(")[0].trim():id;};
const BULAN_MS=["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];
const fmtDate=(s)=>{
  if(!s)return"—";
  const d=new Date(s);
  if(isNaN(d.getTime()))return String(s);
  return `${String(d.getDate()).padStart(2,"0")} ${BULAN_MS[d.getMonth()]} ${d.getFullYear()}`;
};
/* --- tarikh & minggu semasa (untuk sistem kosong / rekod baharu) --- */
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function mingguSemasa(d){ // sepadan dengan GAS mingguDalamTahun()
  const info=mingguInfo(d instanceof Date ? isoDari(d) : d);
  return info?info.minggu:1;
}
/* ---- Minggu kerja Ahad–Khamis, dikira dari TARIKH SESI ---- */
function isoDari(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function mingguInfo(tarikhStr){
  if(!tarikhStr)return null;
  const d=new Date(tarikhStr);
  if(isNaN(d.getTime()))return null;
  const mula=new Date(d); mula.setHours(0,0,0,0);
  mula.setDate(d.getDate()-d.getDay());          // Ahad = permulaan minggu
  const tamat=new Date(mula); tamat.setDate(mula.getDate()+4);   // Khamis
  const akhir=new Date(mula); akhir.setDate(mula.getDate()+7);   // Ahad minggu berikutnya
  const tahun=mula.getFullYear();
  const jan1=new Date(tahun,0,1);
  const ahadPertama=new Date(jan1); ahadPertama.setDate(jan1.getDate()-jan1.getDay());
  const minggu=Math.round((mula-ahadPertama)/(7*86400000))+1;
  return {minggu, tahun, mula:isoDari(mula), tamat:isoDari(tamat), tarikhAkhir:isoDari(akhir),
          hujungMinggu:(d.getDay()===5||d.getDay()===6)};
}
/* Julat tarikh (Ahad–Khamis) dikira daripada NOMBOR MINGGU + TAHUN */
function julatMinggu(minggu, tahun){
  const thn=Number(tahun)||Number(DB.config.TAHUN_SEMASA)||new Date().getFullYear();
  const jan1=new Date(thn,0,1);
  const ahadPertama=new Date(jan1); ahadPertama.setDate(jan1.getDate()-jan1.getDay());
  const mula=new Date(ahadPertama); mula.setDate(ahadPertama.getDate()+(Number(minggu)-1)*7);
  const tamat=new Date(mula); tamat.setDate(mula.getDate()+4);
  return {mula:isoDari(mula), tamat:isoDari(tamat)};
}
/* Papar julat ringkas: "09 – 13 Ogos 2026" */
function julatRingkas(minggu, tahun){
  const j=julatMinggu(minggu,tahun);
  const a=new Date(j.mula), b=new Date(j.tamat);
  const bln=(d)=>BULAN_MS[d.getMonth()];
  const dd=(d)=>String(d.getDate()).padStart(2,"0");
  return (bln(a)===bln(b) && a.getFullYear()===b.getFullYear())
    ? `${dd(a)} – ${dd(b)} ${bln(b)} ${b.getFullYear()}`
    : `${dd(a)} ${bln(a)} – ${dd(b)} ${bln(b)} ${b.getFullYear()}`;
}
/* Adakah penghantaran lewat? (selepas Ahad minggu berikutnya) */
function adakahLewat(tarikhSesi, tarikhHantar){
  const info=mingguInfo(tarikhSesi); if(!info)return false;
  const akhir=new Date(info.tarikhAkhir); akhir.setHours(23,59,59,999);
  const hantar=new Date(tarikhHantar||todayISO());
  return hantar>akhir;
}
/* Laporan aktif sedia ada bagi PPD pada minggu tertentu */
function laporanMingguSedia(ppdId, minggu, tahun, kecualiId){
  return DB.dialog.find(d=>samePpd(d.ppdId,ppdId)&&padanMinggu(d,minggu)
    &&Number(tahunRekod(d))===Number(tahun)&&!isDibatalkan(d)&&!isTangguh(d)&&d.id!==kecualiId)||null;
}

  const w=DB.weeks.find(x=>x.no===LATEST_WEEK);
  return w?w.tarikh:todayISO();
}

function gambarSrc(val){
  if(!val)return null;
  if(String(val).startsWith("data:"))return val;           // demo (data URL)
  if(String(val).startsWith("http"))return val;            // URL penuh
  return `https://drive.google.com/thumbnail?id=${val}&sz=w800`; // live: fileId Drive

  doc.setFillColor(...BRASS); doc.roundedRect(M,7,12,12,2,2,"F");

}

/* Tulis SATU laporan ke dalam dokumen jsPDF sedia ada (guna semula untuk PDF gabungan) */
async function tulisLaporanKeDoc(doc, d, opts={}){
  const dialogId=d.id;
  const issues=DB.isu.filter(i=>i.dialogId===dialogId);
  const gambarData=await resolveGambar(d);   // [dataUrl|null, dataUrl|null]
  if(!opts.pertama) doc.addPage();
  const pageW=doc.internal.pageSize.getWidth();   // 210
  const M=18;                                     // margin
  const NAVY=[15,41,66], BRASS=[184,134,11], INK=[26,36,48];

  /* ---- Kepala surat (bergambar/berformat) ---- */
  doc.setFillColor(...NAVY); doc.rect(0,0,pageW,26,"F");
  if(LOGO_PDF){
    try{ doc.addImage(LOGO_PDF,"PNG",M,5,16,16); }
    catch(e){ drawCrestFallback(doc,NAVY,BRASS,M); }
  }else{
    drawCrestFallback(doc,NAVY,BRASS,M);
  }
  doc.setTextColor(255,255,255);
  doc.setFont("helvetica","bold"); doc.setFontSize(12);
  doc.text("JABATAN PENDIDIKAN NEGERI KEDAH", M+20, 12.5);
  doc.setFont("helvetica","normal"); doc.setFontSize(8.5);
  doc.setTextColor(224,184,74);
  doc.text("Sektor Perancangan & Pengurusan PPD (S4PD)", M+20, 18);

  /* ---- LAMPIRAN A ---- */
  doc.setTextColor(...INK);
  doc.setFont("helvetica","bolditalic"); doc.setFontSize(11);
  doc.text("LAMPIRAN A", pageW-M, 34, {align:"right"});

  /* ---- Tajuk ---- */
  doc.setFont("helvetica","bold"); doc.setFontSize(13);
  doc.text("LAPORAN", pageW/2, 43, {align:"center"});
  doc.setFontSize(12);
  doc.text("Dialog Prestasi Pejabat Pendidikan Daerah", pageW/2, 50, {align:"center"});
  doc.text("DP PPD", pageW/2, 57, {align:"center"});
  doc.setDrawColor(...BRASS); doc.setLineWidth(0.6);
  doc.line(M, 61, pageW-M, 61);

  /* ---- Butiran bernombor ---- */
  let y=71;
  doc.setFontSize(11); doc.setTextColor(...INK);
  const labelW=32;
  function field(no,label,val){
    doc.setFont("helvetica","bold"); doc.text(`${no}.`, M, y);
    doc.text(label, M+7, y);
    doc.setFont("helvetica","normal");
    const lines=doc.splitTextToSize(val||"—", pageW-M-(M+7+labelW));
    doc.text(lines, M+7+labelW, y);
    y+=Math.max(7, lines.length*6);
  }
  field(1,"Pengerusi","  :  "+(d.pengerusi||"—"));
  field(2,"Tarikh","  :  "+fmtDate(d.tarikh));
  field(3,"Hari","  :  "+(d.hari||hariMelayu(d.tarikh)));
  field(4,"Masa","  :  "+(d.masa||"—"));
  field(5,"Tempat","  :  "+(d.tempat||"—"));

  // 6. Kehadiran (senarai a,b,c,d)
  doc.setFont("helvetica","bold"); doc.text("6.", M, y); doc.text("Kehadiran", M+7, y);
  doc.setFont("helvetica","normal"); doc.text("  :", M+7+labelW-4, y);
  const kehadiran=Array.isArray(d.kehadiran)?d.kehadiran:(d.kehadiran?String(d.kehadiran).split(/\n|·/).map(s=>s.trim()).filter(Boolean):[]);
  y+=7;
  const abjad="abcdefghij";
  if(kehadiran.length){
    kehadiran.forEach((k,idx)=>{
      const lines=doc.splitTextToSize(`${abjad[idx]||"-"}.  ${k}`, pageW-M-(M+12));
      doc.text(lines, M+12, y); y+=Math.max(6, lines.length*5.5);
    });
  }else{doc.text("—", M+12, y); y+=6;}
  y+=2;

  // 7. Isu dan Tindakan (jadual)
  doc.setFont("helvetica","bold"); doc.text("7.", M, y); doc.text("Isu dan Tindakan :", M+7, y);
  y+=3;
  const rows=issues.map((i,idx)=>[String(idx+1), i.penerangan||"", i.tindakan||"", i.sektorPegawai||""]);
  if(!rows.length)rows.push(["","","",""]);
  doc.autoTable({
    startY:y+2,
    head:[["BIL.","ISU","TINDAKAN","SEKTOR /\nPEGAWAI"]],
    body:rows,
    margin:{left:M,right:M},
    styles:{font:"helvetica",fontSize:9.5,cellPadding:2.5,valign:"top",lineColor:[120,120,120],lineWidth:0.2,textColor:INK},
    headStyles:{fillColor:NAVY,textColor:[255,255,255],fontStyle:"bold",halign:"center",fontSize:9.5},
    columnStyles:{0:{cellWidth:13,halign:"center"},1:{cellWidth:66},2:{cellWidth:66},3:{cellWidth:29}},
    theme:"grid",
  });
  y=doc.lastAutoTable.finalY+10;

  // Nota perkara luar kawalan KPPD (untuk penyelarasan JPN)
  const luarBil=issues.map((i,idx)=>({no:idx+1,luar:(i.kawalanKPPD||"Ya")==="Tidak"})).filter(x=>x.luar).map(x=>x.no);
  if(luarBil.length){
    doc.setFont("helvetica","italic"); doc.setFontSize(8.5); doc.setTextColor(150,30,30);
    const note=`Nota: Bil. ${luarBil.join(", ")} adalah perkara di luar kawalan KPPD — dikemukakan untuk penyelarasan di peringkat JPN.`;
    const nlines=doc.splitTextToSize(note, pageW-2*M);
    doc.text(nlines, M, y); y+=nlines.length*4.5+6;
    doc.setTextColor(...INK);
  }else{y+=4;}

  /* ---- Tandatangan ---- */
  if(y>240){doc.addPage();y=40;}
  const colW=(pageW-2*M-12)/2;          // lebar setiap lajur tandatangan
  const colL=M, colR=M+colW+12;
  doc.setFont("helvetica","normal"); doc.setFontSize(11);
  doc.text("Dicatat oleh:", colL, y);
  doc.text("Disahkan oleh:", colR, y);
  y+=16;
  doc.setDrawColor(120,120,120); doc.setLineWidth(0.3);
  doc.line(colL, y, colL+colW, y);
  doc.line(colR, y, colR+colW, y);
  y+=6;
  doc.setFontSize(9.5);
  // balut nama supaya tidak bertindih dengan lajur sebelah
  const namaL=doc.splitTextToSize(d.dicatatOleh||"………………………………", colW);
  const namaR=doc.splitTextToSize(d.disahkanOleh||"………………………………", colW);
  doc.text(namaL, colL, y);
  doc.text(namaR, colR, y);
  y+=Math.max(namaL.length, namaR.length)*4.6;   // turun ikut baris terbanyak

  // s.k. Pengarah Pendidikan JPN (laporan dihantar untuk penyelarasan)
  y+=12;
  doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(...NAVY);
  doc.text("s.k.", M, y);
  doc.setFont("helvetica","normal"); doc.setTextColor(...INK);
  doc.text("Pengarah Pendidikan, Jabatan Pendidikan Negeri Kedah", M+10, y);
  if(d.dihantarKePengarah){
    doc.setFont("helvetica","italic"); doc.setFontSize(8.5); doc.setTextColor(31,138,76);
    doc.text(`(Dihantar${d.tarikhHantarPengarah?" · "+fmtDate(d.tarikhHantarPengarah):""})`, M+10, y+4.5);
    doc.setTextColor(...INK);
  }

  /* ---- Lampiran Gambar (halaman berasingan) ---- */
  const validImgs=gambarData.filter(Boolean);
  if(validImgs.length){
    doc.addPage();
    // kepala surat ringkas
    doc.setFillColor(...NAVY); doc.rect(0,0,pageW,20,"F");
    if(LOGO_PDF){try{doc.addImage(LOGO_PDF,"PNG",M,3,14,14);}catch(e){}}
    doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(11);
    doc.text("LAMPIRAN GAMBAR", M+18, 12);
    doc.setTextColor(...INK);
    doc.setFont("helvetica","normal");doc.setFontSize(9);
    doc.text(`${ppdName(d.ppdId)} · Dialog Prestasi Minggu ${d.minggu}/${d.tahun}`, M, 28);
    let gy=34;
    const maxW=pageW-2*M;
    const maxH=(doc.internal.pageSize.getHeight()-40-14*validImgs.length)/validImgs.length; // ruang seimbang
    validImgs.forEach((data,idx)=>{
      try{
        const props=doc.getImageProperties(data);
        let w=maxW, h=w*props.height/props.width;
        if(h>maxH){h=maxH; w=h*props.width/props.height;}
        const x=(pageW-w)/2;
        doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(...NAVY);
        doc.text(`Gambar ${idx+1}`, M, gy);
        doc.setTextColor(...INK);
        const fmt=/^data:image\/png/i.test(data)?"PNG":"JPEG";
        doc.addImage(data,fmt,x,gy+3,w,h);
        doc.setDrawColor(180,180,180);doc.setLineWidth(0.2);doc.rect(x,gy+3,w,h);
        gy+=h+16;
      }catch(e){/* langkau gambar rosak */}
    });
  }

  /* ---- Kaki ---- */
  const ph=doc.internal.pageSize.getHeight();
  doc.setFontSize(8); doc.setTextColor(150,150,150);
  doc.text(`Dijana melalui Sistem Pemantauan Dialog Prestasi PPD · ${ppdName(d.ppdId)} · Minggu ${d.minggu}/${d.tahun}`, pageW/2, ph-8, {align:"center"});

  const fnamePPD=ppdName(d.ppdId).replace(/[^a-zA-Z0-9]/g,"_");
  const filename=`Laporan_DP_${fnamePPD}_M${d.minggu}_${d.tahun}.pdf`;
  return {doc, filename};
}
/* ============================================================
   PDF GABUNGAN — semua laporan mengikut minggu & pilihan PPD
   ============================================================ */
function laporanTerpilih(minggu, ppdId){
  let list = dialogAktif(DB.dialog).filter(d=>padanMinggu(d,minggu));
  if(ppdId) list = list.filter(d=>samePpd(d.ppdId,ppdId));
  // jika ada pendua, ambil laporan terkini sahaja bagi setiap PPD
  const ikutPpd={};
  list.forEach(d=>{
    const k=normId(d.ppdId);
    if(!ikutPpd[k] || String(d.tarikhSubmit||"").localeCompare(String(ikutPpd[k].tarikhSubmit||""))>0) ikutPpd[k]=d;
  });
  const susunan=DB.ppd.map(p=>normId(p.id));
  return Object.values(ikutPpd).sort((a,b)=>susunan.indexOf(normId(a.ppdId))-susunan.indexOf(normId(b.ppdId)));
}

async function janaPDFGabungan(minggu, ppdId){
  if(!window.jspdf||!window.jspdf.jsPDF){toast("Pustaka PDF belum dimuat — cuba semula");return;}
  const senarai=laporanTerpilih(minggu,ppdId);
  if(!senarai.length){toast("Tiada laporan untuk pilihan ini");return;}
  const btn=$("#btnJana");
  if(btn){btn.disabled=true;btn.textContent="Menjana PDF…";}
  try{
    const { jsPDF } = window.jspdf;
    const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
    mukaDepanGabungan(doc,minggu,ppdId,senarai);
    for(const d of senarai){
      if(btn)btn.textContent=`Menjana… (${senarai.indexOf(d)+1}/${senarai.length})`;
      await tulisLaporanKeDoc(doc,d,{pertama:false});
    }
    const tag = ppdId ? ppdName(ppdId).replace(/[^a-zA-Z0-9]/g,"_") : "Semua_PPD";
    doc.save(`Laporan_DP_${tag}_M${minggu}_${DB.config.TAHUN_SEMASA}.pdf`);
    toast(`PDF gabungan dijana — ${senarai.length} laporan`);
  }catch(err){
    toast("Gagal menjana PDF gabungan");
  }finally{
    if(btn){btn.disabled=false;btn.textContent="⬇ Jana PDF Gabungan";}
  }
}

  doc.setTextColor(...INK);
  doc.setFont("helvetica","bold"); doc.setFontSize(17);
  doc.text("HIMPUNAN LAPORAN DIALOG PRESTASI PPD", pageW/2, 74, {align:"center"});
  doc.setDrawColor(...BRASS); doc.setLineWidth(0.6); doc.line(M,79,pageW-M,79);

  doc.setFont("helvetica","normal"); doc.setFontSize(11);
  const skop = ppdId ? ppdName(ppdId) : `Semua PPD (${DB.ppd.length} daerah)`;
  let y=90;
  [["Minggu", `${minggu} / ${DB.config.TAHUN_SEMASA}`],
   ["Skop", skop],
   ["Bilangan laporan", `${senarai.length} laporan`],
   ["Tarikh jana", fmtDate(todayISO())]].forEach(([k,v])=>{
    doc.setFont("helvetica","bold"); doc.text(k, M, y);
    doc.setFont("helvetica","normal"); doc.text(": "+v, M+42, y);
    y+=8;
  });

  // Jadual kandungan
  y+=6;
  const rows=senarai.map((d,idx)=>{
    const nIsu=DB.isu.filter(i=>i.dialogId===d.id).length;
    const luar=DB.isu.filter(i=>i.dialogId===d.id && (i.kawalanKPPD||"Ya")==="Tidak").length;
    return [String(idx+1), ppdName(d.ppdId), fmtDate(d.tarikh), String(nIsu), luar?String(luar):"—"];
  });
  doc.autoTable({
    startY:y,
    head:[["BIL.","PPD","TARIKH SESI","BIL. ISU","LUAR KAWALAN KPPD"]],
    body:rows,
    margin:{left:M,right:M},
    styles:{font:"helvetica",fontSize:9.5,cellPadding:2.5,lineColor:[120,120,120],lineWidth:0.2,textColor:INK},
    headStyles:{fillColor:NAVY,textColor:[255,255,255],fontStyle:"bold",halign:"center",fontSize:9},
    columnStyles:{0:{cellWidth:14,halign:"center"},2:{cellWidth:32,halign:"center"},
                  3:{cellWidth:22,halign:"center"},4:{cellWidth:36,halign:"center"}},
    theme:"grid",
  });

  // PPD belum hantar (jika skop semua)
  if(!ppdId){
    const hantar=new Set(senarai.map(d=>normId(d.ppdId)));
    const belum=DB.ppd.filter(p=>!hantar.has(normId(p.id))).map(p=>p.nama);
    let yy=doc.lastAutoTable.finalY+10;
    doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...NAVY);
    doc.text(`Status pematuhan: ${senarai.length}/${DB.ppd.length} PPD telah menghantar`, M, yy);
    if(belum.length){
      yy+=6;
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(150,30,30);
      const lines=doc.splitTextToSize("Belum hantar: "+belum.join(", "), pageW-2*M);
      doc.text(lines, M, yy);
    }
    doc.setTextColor(...INK);
  }

  doc.setFontSize(8); doc.setTextColor(150,150,150);
  doc.text("Dijana melalui Sistem Pemantauan Dialog Prestasi PPD · JPN Kedah", pageW/2, ph-8, {align:"center"});
}

/* Dapatkan gambar sebagai data URL untuk PDF (demo terus · live via GAS) */
async function resolveGambar(d){
  const out=[];
  for(const val of [d.gambar1,d.gambar2]){
    if(!val){out.push(null);continue;}
    if(String(val).startsWith("data:")){out.push(val);continue;}
    if(!CONFIG.DEMO_MODE){
      try{ const b64=await apiGet("getGambar",{id:val}); out.push(b64); }
      catch(e){ out.push(null); }
    }else{ out.push(null); }
  }
  return out;
}

function quickLogin(u){$("#loginUser").value=u;$("#loginPass").value="demo";doLogin();}
async function doLogin(){
  const u=$("#loginUser").value.trim().toLowerCase();
  const pass=$("#loginPass").value;
  const btn=document.querySelector("#loginView .btn-primary");
  if(CONFIG.DEMO_MODE){
    const user=DB.users.find(x=>x.username===u);
    if(!user){toast("Nama pengguna tidak dijumpai");return;}
    enterApp(user); // DEMO: sebarang kata laluan diterima
    return;
  }
  // ---- MOD LIVE: sahkan + muat data dalam SATU panggilan (lebih laju) ----
  if(!u||!pass){toast("Sila isi nama pengguna & kata laluan");return;}
  try{
    if(btn){btn.disabled=true;btn.textContent="Log masuk…";}
    const res=await apiPost("login",{username:u,password:pass}); // {user, init}
    const user=res.user||res; // sokong format lama jika perlu
    const sess={username:String(user.Username||u).toLowerCase(),nama:user.Nama,
      peranan:user.Peranan,ppdId:user.PPD_ID&&user.PPD_ID!=="-"?user.PPD_ID:null};
    if(res.init){
      mapFromSheets(res.init);
      LATEST_WEEK=mingguSemasa(new Date());
    }else{
      await loadAllData(); // fallback jika GAS versi lama
    }
    enterApp(sess);
  }catch(err){
    toast(err.message||"Log masuk gagal");
  }finally{
    if(btn){btn.disabled=false;btn.textContent="Log Masuk";}
  }
}
function enterApp(user){

/* ============================================================
   JPN: MAKLUM BALAS
   ============================================================ */
function renderMaklumBalas(){
  let h=`<div class="page-head"><div class="eyebrow">Pentadbiran</div><h2>Maklum Balas kepada PPD</h2>
    <p>Beri komen JPN pada sesi Dialog Prestasi — PPD nampak bila log masuk</p></div>`;

    ${DB.ppd.map(p=>`<option value="${p.id}">${p.nama}</option>`).join("")}</select></div>`;
  h+=`<div id="mbList"></div>`;
  $("#main").innerHTML=h;
  renderMBList();
}
function renderMBList(){
  const fp=$("#fbPpd")?$("#fbPpd").value:"";
  let dialogs=dialogAktif(DB.dialog).filter(d=>!fp||d.ppdId===fp).sort((a,b)=>b.minggu-a.minggu);
  let h="";
  dialogs.slice(0,20).forEach(d=>{
    const nIsu=DB.isu.filter(i=>i.dialogId===d.id).length;
    const fbs=DB.maklumBalas.filter(f=>f.dialogId===d.id);
    h+=`<div class="card"><div class="card-head"><div>
      <h3 style="font-size:16px">${ppdName(d.ppdId)} · Minggu ${d.minggu}</h3>
      <div class="sub">${fmtDate(d.tarikh)} · ${nIsu} isu dibincangkan</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" onclick="generateLaporanPDF('${d.id}')">⬇ PDF</button>
        <button class="btn btn-brass btn-sm" onclick="openFeedback('${d.id}')">+ Beri Maklum Balas</button></div></div>
      <div class="card-body">`;
    const thumbs=gambarThumbsHtml(d);
    if(thumbs)h+=`<div style="margin-bottom:14px">${thumbs}</div>`;
    if(fbs.length){
      fbs.forEach(f=>{h+=`<div class="fb-item"><div class="fb-meta"><b>${f.oleh}</b> · ${fmtDate(f.tarikh)}</div><div class="fb-text">${f.komen}</div></div>`;});
    }else{
      h+=`<div style="color:var(--muted);font-size:13px">Belum ada maklum balas untuk sesi ini.</div>`;
    }
    h+=`</div></div>`;
  });
  $("#mbList").innerHTML=h;
}
function openFeedback(dialogId){
  const d=DB.dialog.find(x=>x.id===dialogId);
  showModal(`Maklum Balas — ${ppdName(d.ppdId)} M${d.minggu}`,
    `<div class="form-field"><label>Komen JPN <span class="req">*</span></label>
     <textarea id="mbInput" placeholder="Tulis maklum balas atau arahan untuk PPD..."></textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Batal</button>
     <button class="btn btn-navy" onclick="saveFeedback('${dialogId}')">Hantar Maklum Balas</button>`);
}
function saveFeedback(dialogId){
  const v=$("#mbInput").value.trim();
  if(!v){toast("Sila tulis komen dahulu");return;}
  if(!CONFIG.DEMO_MODE){
    (async()=>{try{await apiPost("addFeedback",{dialogId,isuId:null,komen:v,oleh:SESSION.nama});
      await refreshData();closeModal();renderMBList();toast("Maklum balas dihantar");
    }catch(err){toast(err.message||"Gagal menghantar");}})();
    return;
  }
  DB.maklumBalas.push({id:"FB"+Date.now(),dialogId,isuId:null,komen:v,oleh:SESSION.nama,tarikh:"2026-08-09"});
  closeModal();renderMBList();toast("Maklum balas dihantar");
}

/* ============================================================
   JPN: PENYELARASAN — Perkara Luar Kawalan KPPD
   Untuk penyelarasan peringkat JPN & penghantaran ke Pengarah.
   ============================================================ */
function renderPenyelarasan(){
  let h=`<div class="page-head"><div class="eyebrow">Pentadbiran · Pengarah Pendidikan JPN</div>
    <h2>Penyelarasan JPN</h2>
    <p>Perkara di luar kawalan KPPD & status penghantaran laporan kepada Pengarah Pendidikan</p></div>`;

  // ---- Bahagian A: perkara luar kawalan KPPD ----
  const luar=isuAktif().filter(i=>i.kawalanKPPD==="Tidak");
  const belumMaklum=luar.filter(i=>i.statusMakluman!=="Telah Dimaklumkan").length;
  h+=`<div class="stat-grid">
    <div class="stat-card warn"><div class="lbl">Perkara Luar Kawalan KPPD</div>
      <div class="val">${luar.length}</div><div class="sub">perlu penyelarasan JPN</div></div>
    <div class="stat-card danger"><div class="lbl">Tindakan Belum Dimaklumkan</div>
      <div class="val">${belumMaklum}</div><div class="sub">kepada sektor/pegawai</div></div>
    <div class="stat-card ok"><div class="lbl">Laporan Dihantar ke Pengarah</div>
      <div class="val">${dialogAktif(DB.dialog).filter(d=>d.dihantarKePengarah).length}<span style="font-size:20px;color:var(--muted)">/${dialogAktif(DB.dialog).length}</span></div>
      <div class="sub">sesi dialog</div></div>
  </div>`;

  h+=`<div class="card"><div class="card-head"><div><h3>Perkara di Luar Kawalan KPPD</h3>
    <div class="sub">Untuk penyelarasan Pengarah Pendidikan JPN · sahkan makluman kepada sektor berkaitan</div></div></div>
    <div class="card-body flush"><div class="scroll-x"><table><thead><tr>
    <th>PPD</th><th>M</th><th>Isu</th><th>Tindakan</th><th>Sektor / Pegawai</th>
    <th class="t-center">Makluman</th></tr></thead><tbody>`;
  if(!luar.length){
    h+=`<tr><td colspan="6"><div class="empty"><div class="ico">✓</div>Tiada perkara luar kawalan KPPD buat masa ini.</div></td></tr>`;
  }else{
    luar.forEach(i=>{
      const d=DB.dialog.find(x=>x.id===i.dialogId);
      const dimaklum=i.statusMakluman==="Telah Dimaklumkan";
      h+=`<tr><td><b>${ppdName(i.ppdId)}</b></td><td><span class="pill">M${d?d.minggu:"?"}</span></td>
        <td style="max-width:230px;font-size:13px">${i.penerangan}</td>
        <td style="max-width:220px;font-size:13px">${i.tindakan||"—"}</td>
        <td style="font-size:12.5px">${i.sektorPegawai||"—"}</td>
        <td class="t-center">${dimaklum
          ? `<div style="display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap">
               <span class="badge b-ok">Telah Dimaklumkan</span>
               <button class="btn btn-ghost btn-sm" title="Batalkan tanda makluman" onclick="undoMakluman('${i.id}')">↺ Undo</button></div>`
          : `<button class="btn btn-brass btn-sm" onclick="tandaMakluman('${i.id}')">Tanda Dimaklumkan</button>`}</td></tr>`;
    });
  }
  h+=`</tbody></table></div></div></div>`;

  // ---- Bahagian B: penghantaran laporan ke Pengarah ----
  h+=`<div class="card"><div class="card-head"><div><h3>Penghantaran Laporan kepada Pengarah</h3>
    <div class="sub">Tandakan sesi yang laporannya telah dihantar untuk penyelarasan JPN</div></div>
    <button class="btn btn-ghost btn-sm" onclick="tandaSemuaPengarah()">Tanda Semua (minggu terkini)</button></div>
    <div class="card-body flush"><div class="scroll-x"><table><thead><tr>
    <th>PPD</th><th>Minggu</th><th class="t-center">Luar Kawalan KPPD</th>
    <th class="t-center">Status ke Pengarah</th><th class="t-center">Tindakan</th></tr></thead><tbody>`;
  dialogAktif(DB.dialog).sort((a,b)=>b.minggu-a.minggu).forEach(d=>{
    const nLuar=DB.isu.filter(i=>i.dialogId===d.id&&i.kawalanKPPD==="Tidak").length;
    h+=`<tr><td><b>${ppdName(d.ppdId)}</b></td><td><span class="pill">M${d.minggu}</span></td>

      <td class="t-center">${d.dihantarKePengarah?'<span class="badge b-ok">Dihantar</span>':'<span class="badge b-danger">Belum</span>'}</td>
      <td class="t-center">${d.dihantarKePengarah
        ? `<button class="btn btn-ghost btn-sm" title="Batalkan tanda penghantaran" onclick="undoPengarah('${d.id}')">↺ Undo</button>`
        : `<button class="btn btn-ghost btn-sm" onclick="tandaPengarah('${d.id}')">Tanda Dihantar</button>`}</td></tr>`;
  });
  h+=`</tbody></table></div></div></div>`;
  $("#main").innerHTML=h;
}
function tandaMakluman(isuId){
  if(!CONFIG.DEMO_MODE){
    (async()=>{try{await apiPost("markMakluman",{isuId});await refreshData();
      renderPenyelarasan();toast("Tindakan ditanda telah dimaklumkan kepada sektor");
    }catch(err){toast(err.message||"Gagal mengemaskini");}})();
    return;
  }
  const i=DB.isu.find(x=>x.id===isuId);
  i.statusMakluman="Telah Dimaklumkan"; i.tarikhMakluman="2026-08-09";
  renderPenyelarasan();toast("Tindakan ditanda telah dimaklumkan kepada sektor");
}
function tandaPengarah(dialogId){
  if(!CONFIG.DEMO_MODE){
    (async()=>{try{await apiPost("markDihantarPengarah",{dialogId});await refreshData();
      buildSidebar();renderPenyelarasan();toast("Laporan ditanda dihantar kepada Pengarah");
    }catch(err){toast(err.message||"Gagal mengemaskini");}})();
    return;
  }
  const d=DB.dialog.find(x=>x.id===dialogId);
  d.dihantarKePengarah=true; d.tarikhHantarPengarah="2026-08-09";
  buildSidebar();renderPenyelarasan();toast("Laporan ditanda dihantar kepada Pengarah");
}
function tandaSemuaPengarah(){
  const senarai=DB.dialog.filter(d=>padanMinggu(d,LATEST_WEEK)&&!d.dihantarKePengarah&&!isDibatalkan(d)&&!isTangguh(d));
  if(!senarai.length){toast("Tiada laporan menunggu penghantaran");return;}
  if(!CONFIG.DEMO_MODE){
    (async()=>{try{
      for(const d of senarai){await apiPost("markDihantarPengarah",{dialogId:d.id});}
      await refreshData();buildSidebar();renderPenyelarasan();toast(`Semua laporan Minggu ${LATEST_WEEK} ditanda dihantar`);
    }catch(err){toast(err.message||"Gagal mengemaskini");}})();
    return;
  }
  senarai.forEach(d=>{d.dihantarKePengarah=true;d.tarikhHantarPengarah="2026-08-09";});
  buildSidebar();renderPenyelarasan();toast(`Semua laporan Minggu ${LATEST_WEEK} ditanda dihantar`);
}

/* ---- UNDO: batalkan tanda tersilap klik ---- */
function undoMakluman(isuId){
  if(!CONFIG.DEMO_MODE){
    (async()=>{try{await apiPost("undoMakluman",{isuId});await refreshData();
      renderPenyelarasan();toast("Tanda makluman dibatalkan");
    }catch(err){toast(err.message||"Gagal membatalkan");}})();
    return;
  }
  const i=DB.isu.find(x=>x.id===isuId);
  if(i){i.statusMakluman="Belum Dimaklumkan"; i.tarikhMakluman=null;}
  renderPenyelarasan();toast("Tanda makluman dibatalkan");
}
function undoPengarah(dialogId){
  if(!CONFIG.DEMO_MODE){
    (async()=>{try{await apiPost("undoDihantarPengarah",{dialogId});await refreshData();
      buildSidebar();renderPenyelarasan();toast("Tanda penghantaran dibatalkan");
    }catch(err){toast(err.message||"Gagal membatalkan");}})();
    return;
  }
  const d=DB.dialog.find(x=>x.id===dialogId);
  if(d){d.dihantarKePengarah=false; d.tarikhHantarPengarah=null;}
  buildSidebar();renderPenyelarasan();toast("Tanda penghantaran dibatalkan");
}

      status pematuhan), diikuti laporan penuh setiap PPD dalam format rasmi LAMPIRAN A.</div>

function kemaskiniPratonton(){
  const wk=$("#mtMinggu")?$("#mtMinggu").value:LATEST_WEEK;
  const pid=$("#mtPpd")?$("#mtPpd").value:"";
  const senarai=laporanTerpilih(wk,pid);

  let h="";
  if(!senarai.length){
    h=`<div class="empty" style="padding:30px 20px"><div class="ico">☰</div>Tiada laporan untuk pilihan ini.</div>`;

    h=`<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px">

        <div style="font-family:'Fraunces',serif;font-size:26px;color:var(--navy);font-weight:600">${senarai.length} laporan</div></div>
      ${belum.length?`<div style="flex:1;min-width:170px;background:var(--danger-bg);border-radius:10px;padding:12px 14px">
        <div style="font-size:12px;font-weight:700;color:var(--danger);text-transform:uppercase;letter-spacing:.05em">Belum hantar</div>
        <div style="font-family:'Fraunces',serif;font-size:26px;color:var(--navy);font-weight:600">${belum.length} PPD</div></div>`:""}
    </div>`;
    h+=`<div class="scroll-x"><table><thead><tr><th>Bil.</th><th>PPD</th><th>Tarikh Sesi</th>
      <th class="t-center">Bil. Isu</th><th class="t-center">Luar Kawalan KPPD</th></tr></thead><tbody>`;
    senarai.forEach((d,i)=>{
      const nIsu=DB.isu.filter(x=>x.dialogId===d.id).length;
      const luar=DB.isu.filter(x=>x.dialogId===d.id&&(x.kawalanKPPD||"Ya")==="Tidak").length;
      h+=`<tr><td>${i+1}</td><td><b>${ppdName(d.ppdId)}</b></td><td>${fmtDate(d.tarikh)}</td>
        <td class="t-center">${nIsu}</td>
        <td class="t-center">${luar?`<span class="badge b-pending">${luar}</span>`:'<span class="badge b-neutral">—</span>'}</td></tr>`;
    });
    h+=`</tbody></table></div>`;
    if(belum.length){
      h+=`<div style="margin-top:12px;font-size:12.5px;color:var(--danger)">
        <b>Belum hantar:</b> ${belum.map(p=>p.nama).join(", ")}</div>`;
    }
  }
  $("#mtPratonton").innerHTML=h;
}
function klikJana(){
  const wk=$("#mtMinggu").value, pid=$("#mtPpd").value;

  h+=`<div class="card"><div class="card-head"><h3>Tetapan Sistem</h3></div><div class="card-body">

      <div class="form-field"><label>Hari Tarikh Akhir Hantar</label>

      <div class="form-field"><label>SLA Tindak Susul (hari)</label>
        <input id="cfgSla" type="number" value="${DB.config.TINDAK_SUSUL_SLA_HARI}"></div>

      <label>Papar notis dalam sistem bila PPD log masuk (belum submit)</label></div>

function openKatModal(){
  showModal("Tambah Kategori Isu",
    `<div class="form-field"><label>Nama Kategori <span class="req">*</span></label>
     <input id="katInput" type="text" placeholder="cth: Keselamatan & Kesihatan Sekolah"></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Batal</button>
     <button class="btn btn-navy" onclick="saveKat()">Simpan</button>`);
}
function saveKat(){
  const v=$("#katInput").value.trim();if(!v){toast("Sila isi nama kategori");return;}
  if(!CONFIG.DEMO_MODE){
    (async()=>{try{await apiPost("addKategori",{nama:v});await refreshData();
      closeModal();renderAdmin();toast("Kategori ditambah");
    }catch(err){toast(err.message||"Gagal menambah");}})();
    return;
  }
  const nid="K"+String(DB.kategori.length+1).padStart(2,"0");
  DB.kategori.push({id:nid,nama:v,aktif:true});
  closeModal();renderAdmin();toast("Kategori ditambah");
}
function toggleKat(id){
  if(!CONFIG.DEMO_MODE){
    (async()=>{try{await apiPost("toggleKategori",{kategoriId:id});await refreshData();
      renderAdmin();toast("Status kategori dikemaskini");
    }catch(err){toast(err.message||"Gagal mengemaskini");}})();
    return;
  }
  const k=DB.kategori.find(x=>x.id===id);k.aktif=!k.aktif;renderAdmin();toast("Status kategori dikemaskini");
}
function saveConfig(){
  const cfg={HARI_TARIKH_AKHIR:$("#cfgHari").value,TINDAK_SUSUL_SLA_HARI:+$("#cfgSla").value,
    REMINDER_EMEL_AKTIF:$("#cfgEmel").checked?"Ya":"Tidak",REMINDER_BANNER_AKTIF:$("#cfgBanner").checked?"Ya":"Tidak"};
  if(!CONFIG.DEMO_MODE){
    (async()=>{try{await apiPost("saveConfig",cfg);await refreshData();toast("Tetapan disimpan");
    }catch(err){toast(err.message||"Gagal menyimpan");}})();
    return;
  }
  DB.config.HARI_TARIKH_AKHIR=cfg.HARI_TARIKH_AKHIR;

/* ============================================================
   PPD: BORANG HANTAR DIALOG
   ============================================================ */
let issueCount=0;
let EDIT_ID=null; // jika tidak null, borang dalam mod kemaskini
const isDibatalkan=(d)=>String(d.status||"").toLowerCase()==="dibatalkan";
const isTangguh=(d)=>String(d.status||"").toLowerCase()==="ditangguh";
/* laporan sebenar sahaja — tidak termasuk rekod dibatalkan / ditangguh */
const dialogAktif=(list)=>list.filter(d=>!isDibatalkan(d)&&!isTangguh(d));
/* Minggu & tahun SEBENAR bagi satu rekod — sentiasa dikira daripada TARIKH SESI.
   Rekod lama mungkin menyimpan MingguKe yang dikira semasa hantar; ini mengatasinya. */
function mingguRekod(d){
  const i=d&&d.tarikh?mingguInfo(d.tarikh):null;
  return i?i.minggu:Number(d&&d.minggu)||0;
}
function tahunRekod(d){
  const i=d&&d.tarikh?mingguInfo(d.tarikh):null;
  return i?i.tahun:(Number(d&&d.tahun)||Number(DB.config.TAHUN_SEMASA));
}
const padanMinggu=(d,wk)=>Number(mingguRekod(d))===Number(wk);
/* rekod penangguhan bagi PPD pada minggu tertentu */
function tangguhBagi(ppdId,wk){
  return DB.dialog.find(d=>samePpd(d.ppdId,ppdId)&&padanMinggu(d,wk)&&isTangguh(d))||null;
}
function ppdTangguhMinggu(wk){
  const sah=new Set(DB.ppd.map(x=>normId(x.id)));
  const set=new Set();
  DB.dialog.forEach(d=>{ if(padanMinggu(d,wk)&&isTangguh(d)&&sah.has(normId(d.ppdId))) set.add(normId(d.ppdId)); });
  return set;
}
/* PPD unik yang menghantar laporan aktif bagi sesuatu minggu (elak kiraan berganda) */
function ppdHantarMinggu(wk){
  const sah=new Set(DB.ppd.map(x=>normId(x.id)));
  const set=new Set();
  DB.dialog.forEach(d=>{
    if(!padanMinggu(d,wk)) return;
    if(isDibatalkan(d)||isTangguh(d)) return;
    const id=normId(d.ppdId);
    if(sah.has(id)) set.add(id);
  });
  return set;
}
/* laporan aktif terkini bagi satu PPD/minggu (jika ada pendua, ambil yang terbaru) */
function dialogTerkini(ppdId,wk){
  const senarai=DB.dialog.filter(d=>samePpd(d.ppdId,ppdId)&&padanMinggu(d,wk)&&!isDibatalkan(d)&&!isTangguh(d));
  if(!senarai.length) return null;
  return senarai.sort((a,b)=>String(b.tarikhSubmit||'').localeCompare(String(a.tarikhSubmit||'')))[0];
}
/* bilangan laporan pendua (PPD hantar >1 kali dalam minggu sama) */
function penduaMinggu(wk){
  const kira={};
  DB.dialog.forEach(d=>{
    if(!padanMinggu(d,wk)||isDibatalkan(d)||isTangguh(d)) return;
    const id=normId(d.ppdId); kira[id]=(kira[id]||0)+1;
  });
  return Object.keys(kira).filter(k=>kira[k]>1).map(k=>ppdName(k));
}
const isuAktif=()=>{const batal=new Set(DB.dialog.filter(isDibatalkan).map(d=>d.id));return DB.isu.filter(i=>!batal.has(i.dialogId));};

  if(!t){ if(el)el.innerHTML=""; return; }
  if($("#dHari"))$("#dHari").value=hariMelayu(t);
  const info=mingguInfo(t);

  let msg=`Sesi ini dikira sebagai <b>Minggu ${info.minggu}/${info.tahun}</b> (${fmtDate(info.mula)} – ${fmtDate(info.tamat)}). Tarikh akhir hantar: <b>${fmtDate(info.tarikhAkhir)}</b>.`;
  let warna="var(--muted)";
  if(info.hujungMinggu){
    msg=`⚠ Tarikh jatuh pada hujung minggu. Sesi DP-PPD dijalankan <b>Ahad–Khamis</b>.`; warna="var(--danger)";
  }else{
    const sedia=laporanMingguSedia(SESSION.ppdId, info.minggu, info.tahun, EDIT_ID);

    else if(adakahLewat(t, todayISO())){ msg+=` <b style="color:var(--brass)">(Penghantaran lewat)</b>`; }
  }
  el.innerHTML=`<span style="color:${warna}">${msg}</span>`;
}

let borangGambar={1:null,2:null};
function pilihGambar(slot,input){
  const file=input.files&&input.files[0];
  if(!file)return;
  if(!file.type.startsWith("image/")){toast("Sila pilih fail imej");input.value="";return;}
  resizeImage(file,1400,0.82,(dataUrl)=>{
    borangGambar[slot]=dataUrl;
    const prev=$("#gprev"+slot), drop=$("#gdrop"+slot);
    prev.innerHTML=`<img src="${dataUrl}" alt="Gambar ${slot}">
      <button type="button" class="gambar-remove" onclick="buangGambar(${slot})">✕ Buang</button>`;
    prev.classList.remove("hidden"); drop.classList.add("hidden");
  });
}
function buangGambar(slot){
  borangGambar[slot]=null;
  $("#gInput"+slot).value="";
  $("#gprev"+slot).classList.add("hidden");
  $("#gprev"+slot).innerHTML="";
  $("#gdrop"+slot).classList.remove("hidden");
}
function resizeImage(file,maxDim,quality,cb){
  const reader=new FileReader();
  reader.onload=(e)=>{
    const img=new Image();
    img.onload=()=>{
      let {width:w,height:h}=img;
      if(w>maxDim||h>maxDim){ if(w>=h){h=Math.round(h*maxDim/w);w=maxDim;} else {w=Math.round(w*maxDim/h);h=maxDim;} }
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      cb(c.toDataURL("image/jpeg",quality));
    };
    img.onerror=()=>toast("Gagal membaca imej");
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

      <textarea class="issueTindakan" placeholder="Tindakan yang dipersetujui / diambil...">${d?(d.tindakan||""):""}</textarea></div>
    <div class="form-field"><label>Sektor / Pegawai</label>
      <input class="issueSektor" type="text" placeholder="Pihak bertanggungjawab (cth: Sektor Pengurusan Akademik)" value="${d?esc(d.sektorPegawai):""}"></div>
    <div class="checkbox-row"><input type="checkbox" class="issueKPPD"${!d||String(d.kawalanKPPD||"Ya")==="Ya"?" checked":""}>
      <label>Perkara ini <b>di bawah kawalan KPPD</b> (buang tanda jika perlu penyelarasan JPN)</label></div>
    <div class="checkbox-row"><input type="checkbox" class="issuePerlu"${!d||d.perluTindakSusul?" checked":""}>
      <label>Isu ini memerlukan tindak susul (dijejak dalam sistem)</label></div>`;
  $("#issueList").appendChild(div);
}
function removeIssue(n){const el=$(`#issue-${n}`);if($("#issueList").children.length<=1){toast("Sekurang-kurangnya satu isu diperlukan");return;}el.remove();}
function submitDialog(){
  const pengerusi=$("#dPengerusi").value.trim();
  const dicatat=$("#dDicatat").value.trim();
  const disah=$("#dDisah").value.trim();
  const blocks=document.querySelectorAll(".issue-block");
  const issues=[];let valid=true;
  blocks.forEach(b=>{
    const kat=b.querySelector(".issueKat").value;
    const desc=b.querySelector(".issueDesc").value.trim();
    const tindakan=b.querySelector(".issueTindakan").value.trim();
    const sektor=b.querySelector(".issueSektor").value.trim();
    const kawalanKPPD=b.querySelector(".issueKPPD").checked?"Ya":"Tidak";
    const perlu=b.querySelector(".issuePerlu").checked;
    if(!kat||!desc||!tindakan){valid=false;return;}
    issues.push({kat,desc,tindakan,sektor,kawalanKPPD,perlu});
  });
  if(!pengerusi||!dicatat||!disah){toast("Sila lengkapkan Pengerusi, Dicatat oleh & Disahkan oleh");return;}
  if(!valid||!issues.length){toast("Sila lengkapkan Kategori, Isu & Tindakan bagi setiap isu");return;}
  const kehadiran=$("#dHadir").value.split("\n").map(s=>s.trim()).filter(Boolean);
  const editing = EDIT_ID ? DB.dialog.find(d=>d.id===EDIT_ID) : null;
  // ---- Minggu dikira daripada TARIKH SESI (bukan tarikh hantar) ----
  const tarikhSesi=$("#dTarikh").value;
  const info=mingguInfo(tarikhSesi);
  if(!info){toast("Sila pilih tarikh sesi yang sah");return;}
  if(info.hujungMinggu){toast("Sesi DP-PPD hanya pada Ahad–Khamis. Sila semak tarikh sesi.");return;}
  const bertindih=laporanMingguSedia(SESSION.ppdId, info.minggu, info.tahun, editing?editing.id:null);
  if(bertindih){
    toast(`Sudah ada laporan bagi Minggu ${info.minggu} — sila kemaskini laporan tersebut`);
    return;
  }
  // batalkan rekod penangguhan bagi minggu ini (laporan sebenar mengatasi penangguhan)
  const tg=tangguhBagi(SESSION.ppdId, info.minggu);

  if(!CONFIG.DEMO_MODE){
    // ---- MOD LIVE: hantar ke GAS ----
    const payload={ppdId:SESSION.ppdId,tarikh:$("#dTarikh").value,hari:$("#dHari").value,
      masa:$("#dMasa").value,tempat:$("#dTempat").value,pengerusi,
      minggu:info.minggu,tahun:info.tahun,tangguhId:(tg?tg.id:""),
      kehadiran,ringkasan:$("#dRingkas").value,disubmitOleh:SESSION.nama,dicatatOleh:dicatat,disahkanOleh:disah,
      gambar1:borangGambar[1]||"",gambar2:borangGambar[2]||"",
      issues:issues.map(is=>({kategoriId:is.kat,penerangan:is.desc,tindakan:is.tindakan,
        sektorPegawai:is.sektor,kawalanKPPD:is.kawalanKPPD,perluTindakSusul:is.perlu}))};
    if(editing) payload.dialogId=editing.id;
    if(!mulaProses(editing?"Menyimpan perubahan…":"Menghantar laporan…",
       "Sila tunggu — jangan klik berulang atau tutup halaman")) return;
    (async()=>{try{
      await apiPost(editing?"updateDialog":"submitDialog",payload); await refreshData();
      EDIT_ID=null;
      toast(editing?"Laporan berjaya dikemaskini ✓":"Laporan Dialog Prestasi berjaya dihantar ✓");
      buildSidebar(); navigate("rekod");
    }catch(err){toast(err.message||"Gagal menyimpan laporan");}
    finally{tamatProses();}})();
    return;
  }

  // ---- MOD DEMO ----
  const keepOrData=(v)=>!v?null:(String(v).startsWith("KEEP:")?String(v).slice(5):v);
  if(!mulaProses(editing?"Menyimpan perubahan…":"Menghantar laporan…")) return;
  if(editing){
    // kemaskini rekod sedia ada
    Object.assign(editing,{tarikh:$("#dTarikh").value,minggu:info.minggu,tahun:info.tahun,pengerusi,hari:$("#dHari").value,
      masa:$("#dMasa").value,tempat:$("#dTempat").value,kehadiran,ringkasan:$("#dRingkas").value,
      dicatatOleh:dicatat,disahkanOleh:disah,
      gambar1:keepOrData(borangGambar[1]),gambar2:keepOrData(borangGambar[2])});
    // ganti isu & tindak susul lama
    const oldIsu=DB.isu.filter(i=>i.dialogId===editing.id).map(i=>i.id);
    DB.tindakSusul=DB.tindakSusul.filter(t=>!oldIsu.includes(t.isuId));
    DB.isu=DB.isu.filter(i=>i.dialogId!==editing.id);
    tulisIsuDemo(editing.id,issues,$("#dTarikh").value);
    EDIT_ID=null;
    tamatProses();
    toast("Laporan berjaya dikemaskini ✓");
    buildSidebar();navigate("rekod");
    return;
  }
  if(tg) DB.dialog=DB.dialog.filter(d=>d.id!==tg.id);   // buang penangguhan
  const dId="D"+Date.now();
  DB.dialog.push({id:dId,ppdId:SESSION.ppdId,tarikh:$("#dTarikh").value,minggu:info.minggu,tahun:info.tahun,
    pengerusi,hari:$("#dHari").value,masa:$("#dMasa").value,tempat:$("#dTempat").value,
    kehadiran,ringkasan:$("#dRingkas").value,status:"Selesai",tarikhSubmit:todayISO(),
    dicatatOleh:dicatat,disahkanOleh:disah,dihantarKePengarah:false,tarikhHantarPengarah:null,
    gambar1:keepOrData(borangGambar[1]),gambar2:keepOrData(borangGambar[2])});
  tulisIsuDemo(dId,issues,$("#dTarikh").value);
  tamatProses();
  toast("Laporan Dialog Prestasi berjaya dihantar ✓");
  buildSidebar();navigate("rekod");
}
/* tulis isu + tindak susul (mod demo) */
function tulisIsuDemo(dId,issues,tarikh){
  issues.forEach((is,idx)=>{
    const iId="I"+Date.now()+idx;
    DB.isu.push({id:iId,dialogId:dId,ppdId:SESSION.ppdId,kategoriId:is.kat,penerangan:is.desc,
      tindakan:is.tindakan,sektorPegawai:is.sektor,perluTindakSusul:is.perlu,tarikh,
      kawalanKPPD:is.kawalanKPPD,statusMakluman:"Belum Dimaklumkan",tarikhMakluman:null});
    if(is.perlu){
      const target=new Date(tarikh);target.setDate(target.getDate()+DB.config.TINDAK_SUSUL_SLA_HARI);
      DB.tindakSusul.push({id:"TS"+Date.now()+idx,isuId:iId,dialogId:dId,ppdId:SESSION.ppdId,kategoriId:is.kat,
        pic:is.sektor||`Pegawai ${ppdName(SESSION.ppdId)}`,tarikhSasaran:target.toISOString().slice(0,10),
        status:"Belum Mula",tarikhSelesai:null,catatan:""});
    }
  });
}

/* ============================================================
   PPD: REKOD DIALOG SAYA
   ============================================================ */
function renderRekod(){
  let h=`<div class="page-head"><div class="eyebrow">${ppdName(SESSION.ppdId)}</div><h2>Rekod Dialog Saya</h2>
    <p>Sejarah laporan Dialog Prestasi & maklum balas JPN</p></div>`;
  const mine=DB.dialog.filter(d=>d.ppdId===SESSION.ppdId).sort((a,b)=>b.minggu-a.minggu);
  if(!mine.length){h+=`<div class="empty"><div class="ico">☰</div>Belum ada rekod dialog.</div>`;$("#main").innerHTML=h;return;}
  mine.forEach(d=>{
    const issues=DB.isu.filter(i=>i.dialogId===d.id);
    const fbs=DB.maklumBalas.filter(f=>f.dialogId===d.id);
    const batal=isDibatalkan(d);
    if(isTangguh(d)){
      h+=`<div class="card"><div class="card-head"><div>
        <h3 style="font-size:17px">Minggu ${d.minggu} · DP-PPD Ditangguh</h3>
        <div class="sub">Direkodkan ${fmtDate(d.tarikhSubmit)}</div></div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn btn-ghost btn-sm" onclick="batalTangguh('${d.id}')">↺ Batal Penangguhan</button>
          <span class="badge b-pending">Ditangguh</span></div></div>
        <div class="card-body"><div style="font-size:13.5px;color:var(--muted)">
        Sesi Dialog Prestasi minggu ini dinyatakan akan dilaksanakan pada minggu berikutnya.
        ${d.ringkasan?`<br><b>Catatan:</b> ${d.ringkasan}`:""}</div></div></div>`;
      return;
    }
    h+=`<div class="card"${batal?' style="opacity:.72"':''}><div class="card-head"><div>
      <h3 style="font-size:17px">Minggu ${d.minggu} · ${fmtDate(d.tarikh)}</h3>
      <div class="sub">${issues.length} isu · dihantar ${fmtDate(d.tarikhSubmit)}${batal?" · <b style='color:var(--danger)'>Dibatalkan</b>":""}</div></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${batal?"":`<button class="btn btn-brass btn-sm" onclick="generateLaporanPDF('${d.id}')">⬇ PDF</button>
        <button class="btn btn-ghost btn-sm" onclick="mulaKemaskini('${d.id}')">✎ Kemaskini</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--danger);border-color:#f0c9c4" onclick="mintaPadamLaporan('${d.id}')">🗑 Padam</button>`}
        <span class="badge ${batal?"b-danger":"b-ok"}">${batal?"Dibatalkan":"Selesai"}</span></div></div><div class="card-body">`;
    if(batal){
      h+=`<div style="font-size:13px;color:var(--muted)">Laporan ini telah dibatalkan${d.tarikhBatal?` pada ${fmtDate(d.tarikhBatal)}`:""}. Rekod dikekalkan untuk tujuan audit dan tidak dikira dalam pemantauan JPN.</div></div></div>`;
      return;
    }
    if(d.ringkasan)h+=`<p style="font-size:13.5px;color:var(--muted);margin-bottom:14px">${d.ringkasan}</p>`;
    issues.forEach(i=>{
      const ts=DB.tindakSusul.find(t=>t.isuId===i.id);
      h+=`<div class="detail-issue"><div class="di-head">
        <span class="badge b-cat">${katShort(i.kategoriId)}</span>
        ${i.perluTindakSusul?'<span class="badge b-progress">Perlu Tindak Susul</span>':''}
        ${ts?statusBadge(ts.status):''}</div>
        <div class="di-desc">${i.penerangan}</div>
        ${i.tindakan?`<div style="font-size:12.5px;color:var(--muted);margin-top:4px"><b>Tindakan:</b> ${i.tindakan}${i.sektorPegawai?` · <b>Sektor/Pegawai:</b> ${i.sektorPegawai}`:''}</div>`:''}</div>`;
    });
    const thumbs=gambarThumbsHtml(d);
    if(thumbs)h+=`<div style="margin-top:14px"><div style="font-size:12px;font-weight:700;color:var(--brass);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Lampiran Gambar</div>${thumbs}</div>`;
    if(fbs.length){
      h+=`<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line)">
        <div style="font-size:12px;font-weight:700;color:var(--brass);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Maklum Balas JPN</div>`;
      fbs.forEach(f=>h+=`<div class="fb-item"><div class="fb-meta"><b>${f.oleh}</b> · ${fmtDate(f.tarikh)}</div><div class="fb-text">${f.komen}</div></div>`);
      h+=`</div>`;
    }
    h+=`</div></div>`;
  });
  $("#main").innerHTML=h;
}

/* ============================================================
   PPD: TINDAK SUSUL SAYA
   ============================================================ */
function renderTindakSusulPPD(){
  let h=`<div class="page-head"><div class="eyebrow">${ppdName(SESSION.ppdId)}</div><h2>Tindak Susul Saya</h2>
    <p>Kemaskini status tindakan bagi isu daerah anda</p></div>`;
  const mine=DB.tindakSusul.filter(t=>t.ppdId===SESSION.ppdId);
  const aktif=mine.filter(t=>t.status!=="Selesai").length;
  h+=`<div class="stat-grid">
    <div class="stat-card warn"><div class="lbl">Aktif</div><div class="val">${aktif}</div><div class="sub">belum selesai</div></div>
    <div class="stat-card ok"><div class="lbl">Selesai</div><div class="val">${mine.length-aktif}</div><div class="sub">daripada ${mine.length} item</div></div>
  </div>`;
  h+=`<div class="card"><div class="card-body flush"><div class="scroll-x"><table><thead><tr>
    <th>Kategori</th><th>Isu</th><th>Sasaran</th><th class="t-center">Status</th><th class="t-center">Kemaskini</th></tr></thead><tbody>`;
  if(!mine.length)h+=`<tr><td colspan="5"><div class="empty"><div class="ico">◎</div>Tiada tindak susul.</div></td></tr>`;
  mine.forEach(t=>{
    const isu=DB.isu.find(x=>x.id===t.isuId);
    h+=`<tr><td><span class="badge b-cat">${katShort(t.kategoriId)}</span></td>
      <td style="max-width:300px;font-size:13px">${isu?isu.penerangan:"—"}</td>
      <td>${fmtDate(t.tarikhSasaran)} ${slaCheck(t)}</td>
      <td class="t-center">${statusBadge(t.status)}</td>
      <td class="t-center"><button class="btn btn-ghost btn-sm" onclick="openTSUpdate('${t.id}')">Kemaskini</button></td></tr>`;
  });
  h+=`</tbody></table></div></div></div>`;
  $("#main").innerHTML=h;
}
function openTSUpdate(tsId){
  const t=DB.tindakSusul.find(x=>x.id===tsId);
  showModal("Kemaskini Tindak Susul",
    `<div class="form-field"><label>Status <span class="req">*</span></label>
       <select id="tsStatus"><option ${t.status==='Belum Mula'?'selected':''}>Belum Mula</option>
       <option ${t.status==='Dalam Tindakan'?'selected':''}>Dalam Tindakan</option>
       <option ${t.status==='Selesai'?'selected':''}>Selesai</option></select></div>
     <div class="form-field"><label>Catatan Kemaskini</label>
       <textarea id="tsCatatan" placeholder="Nyatakan kemajuan tindakan...">${t.catatan||""}</textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Batal</button>
     <button class="btn btn-navy" onclick="saveTS('${tsId}')">Simpan</button>`);
}
function saveTS(tsId){
  const status=$("#tsStatus").value, catatan=$("#tsCatatan").value;
  if(!mulaProses("Menyimpan kemaskini…")) return;
  if(!CONFIG.DEMO_MODE){
    (async()=>{try{await apiPost("updateTindakSusul",{tindakSusulId:tsId,status,catatan});await refreshData();
      closeModal();buildSidebar();renderTindakSusulPPD();toast("Tindak susul dikemaskini");
    }catch(err){toast(err.message||"Gagal mengemaskini");}
    finally{tamatProses();}})();
    return;
  }
  const t=DB.tindakSusul.find(x=>x.id===tsId);
  t.status=status;t.catatan=catatan;
  if(t.status==="Selesai"&&!t.tarikhSelesai)t.tarikhSelesai=todayISO();
  tamatProses();
  closeModal();buildSidebar();renderTindakSusulPPD();toast("Tindak susul dikemaskini");
}

/* ============================================================
   MODAL
   ============================================================ */
function showModal(title,body,foot){
  const m=document.createElement("div");m.className="modal-back";m.id="modalBack";
  m.innerHTML=`<div class="modal"><div class="modal-head"><h3>${title}</h3>
    <button class="banner-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${body}</div><div class="modal-foot">${foot}</div></div>`;
  m.onclick=(e)=>{if(e.target===m)closeModal();};
  document.body.appendChild(m);
}
function closeModal(){const m=$("#modalBack");if(m)m.remove();}

/* enter to login */
$("#loginPass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
if(!CONFIG.DEMO_MODE){const dh=$("#demoHint");if(dh)dh.style.display="none";}
</script>
